name: Fetch News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas deep-translator

      - name: Run scraper
        run: python automation/fetch_news.py

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json groww_page.html

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Groww News"
            git push
          fi
