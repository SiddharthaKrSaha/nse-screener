<!DOCTYPE html>

<head>
    <title>Screener by Siddhartha Kumar Saha</title>

<body>

<h2 id="title">Screener by Siddhartha Kumar Saha</h2>

<div class="page-nav">
    <button id="page1Btn" class="active-page">Page 1</button>
    <button id="page2Btn">Page 2</button>
</div>

<!-- PAGE 1 -->
<div id="page1">

    <div class="top-bar">

        <div class="filter-section">
            <span class="label">Filter:</span>
            <select id="filter">
                <option value="ALL">All</option>
                <option value="GREEN">Up</option>
                <option value="RED">Down</option>
            </select>
        </div>

        <div class="visitor-section">
            <span class="label">Visitor Count:</span>
            <span id="visitorCount">000000</span>
        </div>

        <div class="count-section">
            <span class="label">Row Count:</span>
            <span id="rowCount">0</span>
        </div>

    </div>

    <table id="screener-table">
        <thead>
            <tr>
                <th>Symbol</th>

                <th>
                    LTP as of Last Market Closing Day
                    <br>
                    <select id="cmpSort">
                        <option value="DEFAULT">Default</option>
                        <option value="ASC">Low → High</option>
                    </select>
                </th>

                <th>
                    Trend<br>
                    <span style="color: gray; font-style: italic; font-size: 11px;">
                        (Based on M, W, D Analysis)
                    </span>
                </th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>
